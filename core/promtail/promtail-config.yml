server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Cowrie JSON logs
  - job_name: cowrie
    static_configs:
      - targets:
          - localhost
        labels:
          job: cowrie
          honeypot: cowrie
          __path__: /var/log/honeypots/cowrie/cowrie.json*
    pipeline_stages:
      - json:
          expressions:
            eventid: eventid
            src_ip: src_ip
            src_port: src_port
            dst_port: dst_port
            session: session
            username: username
            password: password
            message: message
            sensor: sensor
            timestamp: timestamp
            input: input
            protocol: protocol
      - labels:
          honeypot:
          src_ip:
          protocol:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000000Z07:00"
