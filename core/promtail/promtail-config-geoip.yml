server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Cowrie JSON logs (with GeoIP enrichment)
  - job_name: cowrie
    static_configs:
      - targets:
          - localhost
        labels:
          job: cowrie
          honeypot: cowrie
          __path__: /var/log/honeypots/cowrie/cowrie.json*
    pipeline_stages:
      # Drop empty lines
      - match:
          selector: '{job="cowrie"}'
          stages:
            - drop:
                expression: "^\\s*$"
      - json:
          expressions:
            eventid: eventid
            src_ip: src_ip
            src_port: src_port
            dst_port: dst_port
            session: session
            username: username
            password: password
            message: message
            sensor: sensor
            timestamp: timestamp
            input: input
            protocol: protocol
      # GeoIP enrichment: looks up src_ip in GeoLite2-City.mmdb and adds
      # geoip_country_name, geoip_country_code, geoip_city_name,
      # geoip_latitude, geoip_longitude, geoip_autonomous_system_organization
      # as extracted fields (not labels — high cardinality).
      - geoip:
          db: /etc/promtail/geoip/GeoLite2-City.mmdb
          source: src_ip
          db_type: city
      # Only promote low-cardinality fields to labels.
      # High-cardinality fields like src_ip are kept as extracted data
      # and can be queried with | json | src_ip = "x.x.x.x" in LogQL.
      # Promoting src_ip to a label creates a new Loki stream per IP,
      # which quickly exhausts max_streams_per_user and drops logs.
      - labels:
          protocol:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.999999999Z07:00"
          fallback_formats:
            - "2006-01-02T15:04:05.999999999-07:00"
            - "2006-01-02T15:04:05Z07:00"
          action_on_failure: fudge

  # Docker container logs - captures stdout/stderr from all honeystack containers
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=honeystack"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container_name
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - docker: {}
