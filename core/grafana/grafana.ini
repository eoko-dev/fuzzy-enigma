[server]
http_port = 3000
protocol = https
cert_file = /etc/grafana/certs/grafana.crt
cert_key = /etc/grafana/certs/grafana.key

[security]
admin_user = admin
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = warn

[alerting]
enabled = false

[unified_alerting]
enabled = false

[explore]
enabled = true

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/honeypot-overview.json
