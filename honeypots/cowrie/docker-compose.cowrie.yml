services:
  # Init container to ensure the shared log directory is writable by cowrie
  # (cowrie runs as UID 1000 inside the container; bind mounts default to root)
  cowrie-log-init:
    image: busybox:latest
    container_name: honeystack-cowrie-log-init
    restart: "no"
    command: sh -c 'chown -R 1000:1000 /cowrie-logs && chmod 775 /cowrie-logs'
    volumes:
      - ${LOG_DIR:-/var/log/honeypots}/cowrie:/cowrie-logs

  cowrie:
    image: cowrie/cowrie:latest
    container_name: honeystack-cowrie
    restart: unless-stopped
    depends_on:
      cowrie-log-init:
        condition: service_completed_successfully
    ports:
      - "22:2222"
      - "2222:2222"
      - "23:2223"
      - "2223:2223"
    environment:
      # Cowrie env vars use COWRIE_{SECTION}_{KEY} with a single underscore separator.
      # Sections with underscores (e.g. output_jsonlog) cannot be addressed via env vars
      # due to ambiguity in parsing; those settings are controlled via cowrie.cfg.local.
      - COWRIE_ssh_listen_endpoints=tcp:2222:interface=0.0.0.0
      - COWRIE_telnet_listen_endpoints=tcp:2223:interface=0.0.0.0
      - COWRIE_honeypot_hostname=${COWRIE_HOSTNAME:-svr04}
      - COWRIE_honeypot_sensor_name=honeystack-cowrie
      - COWRIE_honeypot_log_path=/cowrie-logs
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - ${LOG_DIR:-/var/log/honeypots}/cowrie:/cowrie-logs
      - ./cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg.local:ro
    networks:
      - honeystack
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  cowrie-var:

networks:
  honeystack:
    name: honeystack
    driver: bridge
