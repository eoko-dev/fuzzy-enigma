services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: honeystack-cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
      - "2222:2222"
      - "23:2223"
      - "2223:2223"
    environment:
      - COWRIE_output_jsonlog__enabled=true
      - COWRIE_output_jsonlog__logfile=/cowrie-logs/cowrie.json
      - COWRIE_ssh__listen_endpoints=tcp:2222:interface=0.0.0.0
      - COWRIE_telnet__listen_endpoints=tcp:2223:interface=0.0.0.0
      - COWRIE_honeypot__hostname=${COWRIE_HOSTNAME:-svr04}
      - COWRIE_honeypot__sensor_name=honeystack-cowrie
      - COWRIE_honeypot__log_path=/cowrie-logs
    volumes:
      - cowrie-var:/cowrie/cowrie-var
      - ${LOG_DIR:-/var/log/honeypots}/cowrie:/cowrie-logs
      - ./cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg.local:ro
    networks:
      - honeystack
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  cowrie-var:

networks:
  honeystack:
    name: honeystack
    driver: bridge
