# Cowrie configuration overrides for HoneyStack
# This file is loaded as cowrie.cfg.local and overrides defaults

[honeypot]
# Hostname visible to attackers
hostname = svr04
# Timezone for logs
timezone = UTC

[ssh]
# SSH listen endpoint
listen_endpoints = tcp:2222:interface=0.0.0.0
# SSH version string (mimic common servers)
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
# Enable SFTP support
sftp_enabled = true

[telnet]
# Telnet listen endpoint
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
# Enable JSON logging for Loki ingestion
enabled = true
epoch_timestamp = false

[output_textlog]
enabled = true

# Download storage for files attackers try to upload
[output_malware]
enabled = false
