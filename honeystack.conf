# HoneyStack Configuration
# List of enabled honeypot modules (space-separated)
ENABLED_HONEYPOTS="cowrie"

# Port for real SSH access (honeypot will take over port 22)
SSH_PORT=22222

# Grafana web interface port
GRAFANA_PORT=3000

# Installation directory
INSTALL_DIR=/opt/honeystack

# Log directory
LOG_DIR=/var/log/honeypots

# GeoIP database directory (auto-downloaded during install)
GEOIP_DIR=/opt/honeystack/geoip
